[package]
name = "glint"
version = "1.0.23-beta.1"
edition = "2021"
description = "A fast, lightweight file explorer for Windows that draws everything itself"
license = "MIT"
authors = ["tamara"]
repository = "https://github.com/npr-tami/glint"
publish = false
build = "build.rs"

[[bin]]
name = "glint"
path = "src/main.rs"

[dependencies]
# Vector2, the point type Direct2D uses (already part of the `windows` crate family).
windows-numerics = "=0.3.1"
# settings.json: reading and writing the settings (settings.rs); GitHub's answers about releases (update.rs).
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Needed by name for `#[implement]` (fileops.rs: the copy engine's progress reports). Already part of
# the `windows` crate, so nothing new is downloaded or built.
windows-core = "=0.62.2"
# .zip files (archive.rs): browsing and unpacking (Deflate and Deflate64), and making them
# (Compress to zip, with Deflate).
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }
# The Deflate packer and unpacker the zip code uses: zlib-rs, a pure-Rust zlib (about twice as fast
# as miniz_oxide both ways), using the fastest code this PC's processor can run.
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
# .7z files (archive.rs): browsing and unpacking (LZMA and LZMA2), and making them (Compress to 7z,
# with LZMA2: "compress" adds the LZMA2 packer of the lzma-rust2 crate it already uses).
sevenz-rust2 = { version = "=0.24.0", default-features = false, features = ["compress"] }

[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    # Asking GitHub for the newest release and downloading it (update.rs).
    # Playing videos in the Space preview (video.rs).
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    # Working out a file's fingerprint (SHA-256, MD5, SHA-1) in the details panel (details.rs).
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # `glint.exe --version` in a terminal (update.rs).
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_IO",
    # The new Glint.exe's version check has a time limit, which stops what it started too (update.rs).
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    # Reading GIF frame timings (anim.rs).
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
