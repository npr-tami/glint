[package]
name = "glint"
version = "1.0.18-beta.1"
edition = "2021"
description = "A fast, lightweight file explorer for Windows that draws everything itself"
license = "MIT"
authors = ["tamara"]
repository = "https://github.com/npr-tami/glint"
publish = false
build = "build.rs"

[[bin]]
name = "glint"
path = "src/main.rs"

[dependencies]
# Vector2, the point type Direct2D uses (already part of the `windows` crate family).
windows-numerics = "=0.3.1"
# settings.json: reading and writing the settings (settings.rs); GitHub's answers about releases (update.rs).
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Needed by name for `#[implement]` (fileops.rs: the copy engine's progress reports). Already part of
# the `windows` crate, so nothing new is downloaded or built.
windows-core = "=0.62.2"

[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    # Asking GitHub for the newest release and downloading it (update.rs).
    # Playing videos in the Space preview (video.rs).
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # `glint.exe --version` in a terminal (update.rs).
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_IO",
    # The new Glint.exe's version check has a time limit, which stops what it started too (update.rs).
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    # Reading GIF frame timings (anim.rs).
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
